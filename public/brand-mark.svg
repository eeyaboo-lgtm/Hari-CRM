<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1d26"/>
      <stop offset="100%" stop-color="#15161c"/>
    </linearGradient>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#4fc3f7" flood-opacity="0.65"/>
    </filter>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#fb7fc4" flood-opacity="0.65"/>
    </filter>
    <filter id="glowOrange" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#ffa552" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- blue rounded square -->
  <rect x="12" y="30" width="13" height="13" rx="3.5" fill="#4fc3f7" filter="url(#glowBlue)"/>
  <!-- pink circle -->
  <circle cx="32" cy="36.5" r="7" fill="#fb7fc4" filter="url(#glowPink)"/>
  <!-- orange triangle, pointing right -->
  <path d="M42 27 L54 36.5 L42 46 Z" fill="#ffa552" filter="url(#glowOrange)"/>
</svg>
